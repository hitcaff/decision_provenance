[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "decision-provenance"
version = "1.1.0"
description = "Tamper-evident audit logging for ML inference pipelines. Built for EU AI Act Article 13 compliance."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hitesh Srivastava", email = "srivastavahitesh09@gmail.com"}
]
keywords = ["machine-learning", "audit", "provenance", "compliance", "eu-ai-act", "blockchain", "merkle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ipfs = ["requests>=2.28"]
evm  = ["web3>=6.0"]
api  = ["fastapi>=0.100", "uvicorn>=0.22", "pydantic>=2.0"]
all  = ["requests>=2.28", "web3>=6.0", "fastapi>=0.100", "uvicorn>=0.22", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/hitcaff/decision_provenance"
Repository = "https://github.com/hitcaff/decision_provenance"

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_provenance*"]
